services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ..:/workspaces/reading-project:cached
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: reading_db
      POSTGRES_USER: reading_user
      POSTGRES_PASSWORD: reading_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U reading_user -d reading_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data: